{% extends "base.html" %}
{% block title %}Login - EMR{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <h1 style="margin-bottom: 1.5rem; color: #0056b3;">EMR: Digital Patient Record Management</h1>
        <h2>Welcome Back</h2>
        <p style="color: var(--text-secondary);">Please enter your credentials to access the EMR.</p>
    </div>
    <div class="card">
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="form">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>

            <div>
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" required placeholder="Enter your password"
                        style="width: 100%;">
                    <button type="button" id="togglePassword"
                        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                        Show
                    </button>
                </div>
            </div>

            <script>
                const togglePassword = document.querySelector('#togglePassword');
                const password = document.querySelector('#password');

                togglePassword.addEventListener('click', function (e) {
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    this.textContent = type === 'password' ? 'Show' : 'Hide';
                });
            </script>

            <button type="submit" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
