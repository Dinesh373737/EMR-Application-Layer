<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Knowledge Graph</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f9f9f9;
        }

        #network {
            width: 100%;
            height: 100vh;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">Loading Graph...</div>
    <div id="network"></div>

    <script>
        const patientId = "{{ patient_id }}";

        async function loadGraph() {
            try {
                const response = await fetch(`/api/emr/${patientId}/graph`);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (!data.nodes || data.nodes.length === 0) {
                    document.getElementById('network').innerHTML = '<div class="loading">No graph data available.</div>';
                    return;
                }

                const container = document.getElementById('network');
                const visData = {
                    nodes: new vis.DataSet(data.nodes),
                    edges: new vis.DataSet(data.edges)
                };

                const options = {
                    nodes: {
                        shape: 'dot',
                        size: 20,
                        font: { size: 14, color: '#333' },
                        borderWidth: 2,
                        shadow: true,
                    },
                    edges: {
                        width: 1,
                        length: 200,
                        color: { inherit: 'from' },
                        smooth: { type: 'continuous' }
                    },
                    physics: {
                        stabilization: false,
                        barnesHut: {
                            gravitationalConstant: -8000,
                            springConstant: 0.04,
                            springLength: 95
                        }
                    },
                    interaction: {
                        hover: true,
                        tooltipDelay: 200
                    }
                };

                const network = new vis.Network(container, visData, options);

            } catch (error) {
                console.error("Graph Error:", error);
                document.getElementById('loading').innerHTML = `<span style="color:red">Error loading graph: ${error.message}</span>`;
            }
        }

        window.onload = loadGraph;
    </script>
</body>

</html>
