<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EMR Application{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>

<body>
    <header class="top-bar">
        <div class="logo">Medical EMR</div>
        <nav>
            <a href="/dashboard">Patients</a>
            <a href="/upload-report">Upload Report</a>
            <!-- DEBUG USER: {{ user }} -->
            <a href="/admin" style="color: #ff5252; font-weight: bold;">
                Admin ({{ user.role if user else 'None' }})
            </a>
            <a href="/logout" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;">Logout</a>
        </nav>
    </header>

    {% block main %}
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <script src="/static/js/app.js"></script>
</body>

</html>
